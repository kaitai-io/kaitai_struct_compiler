name: Build and Release (hacks/veles)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (blank = auto-generate from date+SHA)'
        required: false
        default: ''

jobs:
  build-universal:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout codilime/kaitai_struct_compiler@hacks/veles
        uses: actions/checkout@v4
        with:
          repository: codilime/kaitai_struct_compiler
          ref: hacks/veles

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add -
          sudo apt-get update -q
          sudo apt-get install -y sbt

      - name: Cache sbt/Ivy artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/**/*.scala', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build universal zip
        run: sbt compilerJVM/universal:packageBin

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            SHA=$(git rev-parse --short HEAD)
            TAG="veles-$(date -u +'%Y%m%d')-${SHA}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload universal zip
        uses: actions/upload-artifact@v4
        with:
          name: universal-zip
          path: "*/target/universal/*.zip"
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout codilime/kaitai_struct_compiler@hacks/veles
        uses: actions/checkout@v4
        with:
          repository: codilime/kaitai_struct_compiler
          ref: hacks/veles

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install sbt
        run: choco install sbt --no-progress -y

      - name: Cache sbt/Ivy artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/**/*.scala', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Build Windows MSI
        run: sbt compilerJVM/windows:packageBin

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: "*/target/windows/*.msi"
          if-no-files-found: error

  release:
    needs: [build-universal, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-universal.outputs.tag }}
          name: Kaitai Struct Compiler - ${{ needs.build-universal.outputs.tag }}
          body: |
            Built from [`codilime/kaitai_struct_compiler@hacks/veles`](https://github.com/codilime/kaitai_struct_compiler/tree/hacks/veles).
          files: |
            dist/universal-zip/*.zip
            dist/windows-msi/*.msi
          token: ${{ secrets.GITHUB_TOKEN }}
